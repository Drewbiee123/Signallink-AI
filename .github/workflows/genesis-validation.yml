name: Genesis Validation V1

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic protocol tests
        run: npm test

      - name: Generate Genesis evidence packet
        run: npm run validate:genesis

      - name: Build production application
        run: npm run build

      - name: Attest Genesis validation packet with GitHub provenance
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: artifacts/genesis-validation-v1.json

      - name: Install Cosign for Sigstore transparency proof
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Genesis packet with GitHub OIDC and Sigstore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: cosign sign-blob artifacts/genesis-validation-v1.json --bundle artifacts/genesis-validation-v1.sigstore.json --yes

      - name: Verify Sigstore bundle in the same clean runner
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: >
          cosign verify-blob artifacts/genesis-validation-v1.json
          --bundle artifacts/genesis-validation-v1.sigstore.json
          --certificate-identity-regexp='https://github.com/Drewbiee123/Signallink-AI/.github/workflows/genesis-validation.yml@refs/(heads/main|pull/[0-9]+/merge)'
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com

      - name: Preserve Genesis evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signalink-genesis-validation-${{ github.run_id }}
          path: |
            artifacts/genesis-validation-v1.json
            artifacts/genesis-validation-v1.sha256
            artifacts/genesis-validation-v1.sigstore.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish validation summary
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const packet = JSON.parse(fs.readFileSync('artifacts/genesis-validation-v1.json', 'utf8'));
          const r = packet.record;
          const sigstore = fs.existsSync('artifacts/genesis-validation-v1.sigstore.json');
          console.log('# SignalLink Genesis Validation V1');
          console.log('');
          console.log(`**Status:** ${r.outcome.status}`);
          console.log(`**Checks:** ${r.outcome.passed} passed / ${r.outcome.failed} failed`);
          console.log(`**100 mutations changed digest:** ${r.mutation_summary.changed_digest}/100`);
          console.log(`**Unique mutation hashes:** ${r.mutation_summary.unique_hashes}/100`);
          console.log(`**Average SHA-256 Hamming distance:** ${r.mutation_summary.average_hamming_distance_bits} bits`);
          console.log(`**Evidence packet SHA-256:** \`${packet.hash}\``);
          console.log(`**Sigstore bundle created and verified:** ${sigstore ? 'yes' : 'no'}`);
          console.log('');
          console.log('Scope: deterministic implementation-level cryptographic and tamper testing. This is not third-party certification.');
          NODE
