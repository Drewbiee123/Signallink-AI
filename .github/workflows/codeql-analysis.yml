name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@fddeee1a7ece751b577e409a89057319e3172939 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          category: "/language:javascript-typescript"

  validate-workflows:
    name: Validate Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install actionlint
        run: |
          mkdir -p /tmp/actionlint
          cd /tmp/actionlint
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.3/actionlint-1.7.3-linux-x86_64.tar.gz \
            | tar xz
          chmod +x actionlint
          echo "/tmp/actionlint" >> "$GITHUB_PATH"

      - name: Validate all workflow files
        run: actionlint -format "{{range .}} {{.Filepath}}:{{.Line}}:{{.Column}}: {{.Message}} {{end}}"
