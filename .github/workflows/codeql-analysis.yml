name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5f6e04b7118b75af6a5a00f6ee6dd6cf08d4c4d7 # v4.0.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@5f6e04b7118b75af6a5a00f6ee6dd6cf08d4c4d7 # v4.0.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5f6e04b7118b75af6a5a00f6ee6dd6cf08d4c4d7 # v4.0.0
        with:
          category: "/language:javascript-typescript"

  validate-workflows:
    name: Validate Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate workflow YAML syntax
        run: |
          set -e
          echo "Validating all workflow YAML files..."
          for f in .github/workflows/*.yml; do
            echo "  Checking: $f"
            node -e "
              const fs = require('fs');
              const yaml = require('js-yaml');
              try {
                yaml.load(fs.readFileSync('$f', 'utf8'));
                console.log('  ✓ Valid YAML');
              } catch(e) {
                console.error('  ✗ YAML Error:', e.message);
                process.exit(1);
              }
            "
          done
          echo "All workflow YAML files validated successfully."

      - name: Install actionlint
        run: |
          mkdir -p /tmp/actionlint
          cd /tmp/actionlint
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.3/actionlint-1.7.3-linux-x86_64.tar.gz \
            | tar xz
          chmod +x actionlint
          echo "/tmp/actionlint" >> "$GITHUB_PATH"

      - name: Run actionlint on all workflows
        run: |
          echo "Running actionlint on all workflows..."
          actionlint -format "{{range .}} {{.Filepath}}:{{.Line}}:{{.Column}}: {{.Message}} {{end}}"
          echo "✓ All workflows pass actionlint checks."
