name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Reproduce challenge in Node
        run: node scripts/reproduce-federal-challenge.mjs
      - name: Reproduce challenge independently in Python
        run: python3 scripts/reproduce-federal-challenge.py
      - run: npm run build
