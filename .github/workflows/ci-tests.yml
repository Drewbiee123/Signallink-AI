name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  protocol-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  reproducibility-matrix:
    name: Reproduce on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Reproduce challenge in Node
        run: node scripts/reproduce-federal-challenge.mjs
      - name: Reproduce challenge independently in Python
        run: python scripts/reproduce-federal-challenge.py
      - name: Reproduce challenge independently in Go
        run: go run scripts/reproduce-federal-challenge.go
