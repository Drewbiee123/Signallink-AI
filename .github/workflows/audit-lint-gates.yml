name: Audit & Lint Gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  audit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run npm audit (production)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run npm audit (full spectrum)
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Lint workflow YAML syntax
        run: |
          for f in .github/workflows/*.yml; do
            echo "Validating $f..."
            node -e "const fs = require('fs'); const yaml = require('js-yaml'); try { yaml.load(fs.readFileSync('$f', 'utf8')); console.log('✓ Valid YAML'); } catch(e) { console.error('✗ YAML Error:', e.message); process.exit(1); }"
          done

      - name: Install actionlint
        run: |
          mkdir -p /tmp/actionlint
          cd /tmp/actionlint
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.3/actionlint_1.7.3_linux_amd64.tar.gz \
            | tar xz --no-same-owner
          chmod +x actionlint
          echo "/tmp/actionlint" >> "$GITHUB_PATH"

      - name: Run actionlint on all workflows
        run: actionlint
